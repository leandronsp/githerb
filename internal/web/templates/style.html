<style>
  /* Paper, not screen. Warm off-white, ink that is not quite black, and every
     other colour muted enough that a diff can be read for an hour. */
  :root {
    --paper: #fcfbf7;
    --raised: #f6f4ee;
    --sunken: #efece3;
    --rule: #e6e2d7;
    --edge: #cec9ba;

    --ink: #2e2e2a;
    --ink-soft: #6e6b62;
    --ink-faint: #a19d92;

    --herb: #5f7f52;
    --herb-deep: #4c6a41;
    --herb-wash: #eaf0e5;

    --add: #f1f6ec;
    --add-edge: #a8c294;
    --del: #fbf0ed;
    --del-edge: #d9b0a4;
    --pick: #fdf6df;
    --pick-edge: #d7bb62;
    --warn: #a15c3a;
  }

  /* Light is the default rather than whatever the desktop feels like, because
     reading a diff for an hour is what this page is for. Dark is a choice. */
  [data-theme="dark"] {
      --paper: #1a1a17;
      --raised: #201f1b;
      --sunken: #262520;
      --rule: #33322c;
      --edge: #4c4a42;

      --ink: #e4e1d8;
      --ink-soft: #a29e93;
      --ink-faint: #7a766c;

      --herb: #8faf7c;
      --herb-deep: #a4c191;
      --herb-wash: #23281f;

      --add: #1e2419;
      --add-edge: #4e6640;
      --del: #2a1e1b;
      --del-edge: #7a4f42;
      --pick: #2b2718;
      --pick-edge: #7d6a2e;
      --warn: #cc8d6c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex; align-items: baseline; gap: 1.25rem;
    padding: 1rem 1.75rem; border-bottom: 1px solid var(--rule);
  }
  .wordmark { font: 500 15px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink-soft); }
  .wordmark b { color: var(--herb); font-weight: 500; }
  header a { color: var(--ink-soft); font-size: 13px; text-decoration: none; }
  header a:hover { color: var(--herb); }
  header .spacer { flex: 1; }
  .theme {
    background: none; border: 0; padding: 0; height: auto;
    font: 12px ui-monospace, monospace; color: var(--ink-faint); cursor: pointer;
  }
  .theme:hover { color: var(--herb); }

  main { padding: 2.25rem 1.75rem 6rem; max-width: 1400px; }
  h1 { font: 500 21px/1.3 ui-sans-serif, system-ui, sans-serif; margin: 0 0 .35rem; letter-spacing: -0.01em; }
  h2 {
    font: 500 11px/1 ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-faint); margin: 1.75rem 0 .6rem;
  }
  h2:first-child { margin-top: 0; }
  .meta { font: 12.5px ui-monospace, monospace; color: var(--ink-soft); margin: 0 0 1.75rem; }
  .muted { color: var(--ink-soft); font-size: 14px; }
  a { color: var(--herb-deep); }

  .columns { display: grid; grid-template-columns: minmax(0, 1fr) 17rem; gap: 2.5rem; align-items: start; }
  @media (max-width: 1050px) { .columns { grid-template-columns: 1fr; } }

  /* the diff */
  .file { margin-bottom: 2rem; }
  .file > h2 {
    position: sticky; top: 0; z-index: 2; background: var(--paper);
    padding: .6rem 0; margin: 0 0 .5rem; border-bottom: 1px solid var(--rule);
    font-size: 12px; letter-spacing: .04em; text-transform: none; color: var(--ink);
    font-family: ui-monospace, monospace;
  }
  .hunk { border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; margin-bottom: .85rem; background: var(--paper); }
  .hunk-header {
    background: var(--raised); color: var(--ink-faint);
    font: 11.5px ui-monospace, monospace; padding: .3rem .85rem; border-bottom: 1px solid var(--rule);
  }
  .line {
    display: grid; grid-template-columns: 3rem 3rem 1fr;
    font: 12.5px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
    cursor: text; position: relative;
  }
  .line:hover { background: var(--sunken); }
  .line .no {
    color: var(--ink-faint); text-align: right; padding: 0 .55rem;
    user-select: none; cursor: pointer;
  }
  .line .text { white-space: pre-wrap; word-break: break-word; padding: 0 .85rem 0 .35rem; }
  .line.added { background: var(--add); box-shadow: inset 2px 0 0 var(--add-edge); }
  .line.removed { background: var(--del); box-shadow: inset 2px 0 0 var(--del-edge); }
  .line.picked { background: var(--pick); box-shadow: inset 2px 0 0 var(--pick-edge); }
  .line.noted .text::after {
    content: "note"; margin-left: .75rem; font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--herb); vertical-align: middle;
  }

  /* the composer sits under the lines it is about */
  .composer { background: var(--raised); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: .75rem .85rem; }
  .composer[hidden] { display: none; }
  .composer .where { margin: 0 0 .5rem; font-size: 11.5px; }
  .composer .row { display: flex; gap: .5rem; align-items: flex-start; }
  textarea {
    flex: 1; min-height: 4.5rem; background: var(--paper); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 3px; padding: .5rem .6rem;
    font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; resize: vertical;
  }
  textarea::placeholder { color: var(--ink-faint); }
  textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--herb); outline-offset: 1px;
  }
  .composer .hint { font: 11px ui-monospace, monospace; color: var(--ink-faint); margin: .4rem 0 0; }

  button {
    font: 500 13px ui-sans-serif, system-ui, sans-serif; height: 2.25rem; padding: 0 .9rem;
    border-radius: 3px; border: 1px solid var(--herb); background: var(--herb);
    color: var(--paper); cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--herb-deep); border-color: var(--herb-deep); }
  button:disabled { background: var(--sunken); border-color: var(--rule); color: var(--ink-faint); cursor: not-allowed; }
  button.quiet {
    background: transparent; color: var(--ink-soft); border-color: var(--edge);
    height: 1.9rem; font-size: 12px; padding: 0 .6rem;
  }
  button.quiet:hover:not(:disabled) { background: var(--sunken); color: var(--ink); border-color: var(--edge); }
  .wide { width: 100%; }

  /* the panel */
  aside { position: sticky; top: 1.5rem; font-size: 14px; }
  .checks { list-style: none; margin: 0 0 1.5rem; padding: 0; }
  .checks li {
    display: flex; gap: .6rem; align-items: baseline; padding: .4rem 0;
    border-bottom: 1px solid var(--rule); font: 12.5px ui-monospace, monospace;
  }
  .checks .name { flex: 1; }
  .checks .status { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
  .checks li.passed .status { color: var(--herb); }
  .checks li.failed .status { color: var(--warn); }
  .checks li.failed { background: var(--del); margin: 0 -.5rem; padding: .4rem .5rem; border-radius: 3px; }

  .notes { list-style: none; margin: 0; padding: 0; }
  .notes li { border-bottom: 1px solid var(--rule); padding: .7rem 0; }
  .notes li:first-child { border-top: 1px solid var(--rule); }
  .notes .meta { margin: 0 0 .25rem; font-size: 11.5px; }
  .notes .body { margin: 0 0 .5rem; font-size: 13.5px; line-height: 1.5; }
  .count { color: var(--herb); }
  .blocked { margin: .5rem 0 0; font-size: 11.5px; font-family: ui-monospace, monospace; }
  .land { width: 100%; margin-top: 1.25rem; }
  aside .quiet.wide { margin-top: .5rem; }

  /* the board */
  .proposals { list-style: none; padding: 0; margin: 0 0 .5rem; }
  .proposals li {
    display: flex; justify-content: space-between; gap: 1.5rem; align-items: baseline;
    padding: .6rem 0; border-bottom: 1px solid var(--rule);
  }
  .proposals li:first-child { border-top: 1px solid var(--rule); }
  .proposals a { text-decoration: none; }
  .proposals a:hover { text-decoration: underline; }
  .proposals .meta { margin: 0; white-space: nowrap; }
</style>
