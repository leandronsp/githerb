<style>
  :root {
    --surface: #fbfbf9; --raised: #f3f3ef; --sunken: #e7e7e1;
    --line: #d8d8d0; --edge: #8e9186;
    --text: #191b16; --muted: #6e7368; --accent: #3a6b35;
    --added: #eef5ec; --removed: #f7ecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #101210; --raised: #171a17; --sunken: #1f231f;
      --line: #2a2e29; --edge: #5e655b;
      --text: #e6e8e4; --muted: #7c8279; --accent: #6fa85c;
      --added: #162014; --removed: #241715;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--surface); color: var(--text);
    font: 15px/1.6 ui-sans-serif, system-ui, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 1.5rem;
    padding: 1rem 1.5rem; border-bottom: 1px solid var(--line);
  }
  .wordmark { font: 500 15px ui-monospace, monospace; color: var(--muted); }
  .wordmark b { color: var(--accent); font-weight: 500; }
  header a { color: var(--muted); font-size: 13px; }
  main { padding: 2rem 1.5rem; max-width: 1500px; }
  h1 { font: 500 24px/1.2 ui-monospace, monospace; letter-spacing: -0.02em; margin: 0 0 .5rem; }
  h2 { font: 500 12px/1 ui-monospace, monospace; letter-spacing: .09em;
       text-transform: uppercase; color: var(--muted); margin: 2rem 0 .75rem; }
  .meta { font: 13px ui-monospace, monospace; color: var(--muted); margin: 0 0 1.5rem; }
  .muted { color: var(--muted); font-size: 14px; }
  a { color: var(--accent); }

  .columns { display: grid; grid-template-columns: minmax(0,1fr) 22rem; gap: 2.5rem; align-items: start; }
  @media (max-width: 1000px) { .columns { grid-template-columns: 1fr; } }

  .hunk { border: 1px solid var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 1.5rem; }
  .hunk-header { background: var(--raised); color: var(--muted);
                 font: 12px ui-monospace, monospace; padding: .35rem .75rem; border-bottom: 1px solid var(--line); }
  .line { display: grid; grid-template-columns: 3.5rem 3.5rem 1fr;
          font: 13px/1.55 ui-monospace, monospace; cursor: pointer; }
  .line:hover { background: var(--sunken); }
  .line .no { color: var(--muted); text-align: right; padding: 0 .6rem; user-select: none; opacity: .7; }
  .line .text { white-space: pre-wrap; word-break: break-word; padding-right: .75rem; }
  .line.added { background: var(--added); }
  .line.removed { background: var(--removed); }
  .line.picked { box-shadow: inset 3px 0 0 var(--accent); background: var(--sunken); }

  aside { position: sticky; top: 1.5rem; }
  .composer[hidden] { display: none; }
  .composer { border: 1px solid var(--edge); border-radius: 2px; padding: .75rem; margin-bottom: 1.5rem; }
  textarea { width: 100%; min-height: 5rem; background: var(--surface); color: var(--text);
             border: 1px solid var(--edge); border-radius: 2px; padding: .5rem;
             font: 14px ui-sans-serif, system-ui, sans-serif; resize: vertical; }
  textarea:focus-visible, button:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  button { font: 500 14px ui-monospace, monospace; height: 2.5rem; padding: 0 1rem;
           border-radius: 2px; border: 1px solid var(--accent); background: var(--accent);
           color: var(--surface); cursor: pointer; }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { background: var(--sunken); border-color: var(--line); color: var(--muted); cursor: not-allowed; }
  button.quiet { background: transparent; color: var(--muted); border-color: var(--line);
                 height: 1.75rem; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .composer button { width: 100%; margin-top: .5rem; }
  .land { width: 100%; margin-top: 1.5rem; }

  .notes { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .notes li { border-bottom: 1px solid var(--line); padding: .75rem 0; }
  .notes .meta { margin: 0 0 .25rem; font-size: 12px; }
  .notes .body { margin: 0 0 .5rem; font-size: 14px; }
  .count { color: var(--accent); }

  .proposals { list-style: none; padding: 0; border-top: 1px solid var(--line); }
  .proposals li { border-bottom: 1px solid var(--line); padding: .75rem 0;
                  display: flex; justify-content: space-between; gap: 1rem; }
  .proposals .meta { margin: 0; }
</style>
