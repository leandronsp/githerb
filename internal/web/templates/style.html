<style>
  /* Paper, not screen. Warm off-white, ink that is not quite black, and every
     other colour muted enough that a diff can be read for an hour. */
  :root {
    --paper: #fcfbf7;
    --raised: #f6f4ee;
    --sunken: #efece3;
    --rule: #e6e2d7;
    --edge: #cec9ba;

    --ink: #2e2e2a;
    --ink-soft: #6e6b62;
    --ink-faint: #a19d92;

    --herb: #5f7f52;
    --herb-deep: #4c6a41;
    --herb-wash: #eaf0e5;

    --add: #e6f3dd;
    --add-edge: #7fae63;
    --del: #fbeae5;
    --del-edge: #d49f8c;
    --pick: #fdf6df;
    --pick-edge: #d7bb62;
    --warn: #a15c3a;
  }

  /* Light is the default rather than whatever the desktop feels like, because
     reading a diff for an hour is what this page is for. Dark is a choice. */
  [data-theme="dark"] {
      --paper: #1a1a17;
      --raised: #201f1b;
      --sunken: #262520;
      --rule: #33322c;
      --edge: #4c4a42;

      --ink: #e4e1d8;
      --ink-soft: #a29e93;
      --ink-faint: #7a766c;

      --herb: #8faf7c;
      --herb-deep: #a4c191;
      --herb-wash: #23281f;

      --add: #1d2a17;
      --add-edge: #5a7f45;
      --del: #2a1e1b;
      --del-edge: #7a4f42;
      --pick: #2b2718;
      --pick-edge: #7d6a2e;
      --warn: #cc8d6c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex; align-items: baseline; gap: 1.25rem;
    padding: 1rem 1.75rem; border-bottom: 1px solid var(--rule);
  }
  .wordmark { font: 500 15px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink-soft); }
  .wordmark b { color: var(--herb); font-weight: 500; }
  header a { color: var(--ink-soft); font-size: 13px; text-decoration: none; }
  header a:hover { color: var(--herb); }
  header .spacer { flex: 1; }
  .theme {
    background: none; border: 0; padding: 0; height: auto;
    font: 12px ui-monospace, monospace; color: var(--ink-faint); cursor: pointer;
  }
  .theme:hover { color: var(--herb); background: none; }
  .theme:focus-visible { outline-offset: 3px; }

  main { padding: 2.25rem 1.75rem 6rem; max-width: 1400px; }

  /* The review page is a frame, not a document: the bar and the two columns
     stay put and only the columns scroll, so the actions never leave. */
  body[data-proposal] { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  body[data-proposal] main { flex: 1; min-height: 0; display: flex; padding: 0; max-width: none; }
  #page { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .bar {
    display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
    padding: .7rem 1.5rem; border-bottom: 1px solid var(--rule); background: var(--raised);
    row-gap: .6rem;
  }
  .bar h1 { font-size: 16px; margin: 0; }
  .bar .meta { margin: 0; }
  .bar .spacer { flex: 1; }
  .bar .actions { display: flex; gap: .5rem; align-items: center; }
  .bar .land { width: auto; margin: 0; }
  .bar .blocked { margin-right: .5rem; color: var(--ink-faint); }

  /* the agent, which is the only thing on the page that moves on its own */
  .agent {
    font: 11.5px ui-monospace, monospace; padding: .15rem .55rem; border-radius: 999px;
    border: 1px solid var(--rule); background: var(--paper); color: var(--ink-soft);
  }
  .agent.working { border-color: var(--herb); background: var(--herb-wash); color: var(--ink); }
  .agent.queued { border-color: var(--pick-edge); background: var(--pick); color: var(--ink); }
  .agent.failed { border-color: var(--del-edge); background: var(--del); color: var(--warn); }

  .timeline { list-style: none; margin: 0 0 1.5rem; padding: 0; font: 12px ui-monospace, monospace; }
  .timeline li {
    display: grid; grid-template-columns: 3rem 1fr; gap: .1rem .6rem;
    padding: .3rem 0; border-bottom: 1px solid var(--rule); color: var(--ink-soft);
  }
  .timeline .when { color: var(--ink-faint); }
  .timeline .why { grid-column: 2; color: var(--ink-faint); }
  .timeline li.failed .what { color: var(--warn); }

  /* the checks read as a strip in the bar, not as a list in a column */
  .bar .checks { display: flex; gap: .6rem; margin: 0; }
  .bar .checks li {
    display: flex; gap: .4rem; align-items: baseline; padding: 0 .5rem;
    border: 1px solid var(--rule); border-radius: 999px; background: var(--paper);
  }
  .bar .checks li.failed { margin: 0; background: var(--del); }
  .bar .checks .meta { color: var(--ink-faint); }

  /* fold every file at once, for a proposal too wide to scan open */
  .fold-all {
    display: flex; align-items: center; gap: .5rem; margin: 0 0 .85rem;
    font: 12px ui-monospace, monospace;
  }
  .fold-all .spacer { flex: 1; }
  h1 { font: 500 21px/1.3 ui-sans-serif, system-ui, sans-serif; margin: 0 0 .35rem; letter-spacing: -0.01em; }
  h2 {
    font: 500 11px/1 ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-faint); margin: 1.75rem 0 .6rem;
  }
  h2:first-child { margin-top: 0; }
  .meta { font: 12.5px ui-monospace, monospace; color: var(--ink-soft); margin: 0 0 1.75rem; }
  .muted { color: var(--ink-soft); font-size: 14px; }
  a { color: var(--herb-deep); }

  .columns {
    flex: 1; min-height: 0; display: grid;
    grid-template-columns: minmax(20rem, 27rem) minmax(0, 1fr);
  }
  .left { overflow-y: auto; padding: 1.25rem 1.4rem 6rem; border-right: 1px solid var(--rule); }
  .diff { overflow-y: auto; padding: 1.25rem 1.5rem 8rem; }
  @media (max-width: 1050px) {
    body[data-proposal] { height: auto; overflow: visible; }
    .columns { grid-template-columns: 1fr; }
    .left, .diff { overflow: visible; border-right: 0; }
  }

  /* an anchor lands under the file header without it, and a landed anchor
     flashes so the eye finds the line it was sent to */
  .line, .chunks li { scroll-margin-top: 4rem; }
  .aimed { animation: aim 1.4s ease-out; }
  @keyframes aim {
    from { background: var(--pick); box-shadow: inset 2px 0 0 var(--pick-edge); }
    to { background: transparent; }
  }

  .added { color: var(--herb); }
  .removed { color: var(--warn); }
  .scope { margin: 0; font: 12px ui-monospace, monospace; display: flex; gap: .3rem; align-items: baseline; }
  .scope .label { color: var(--ink-faint); }
  .scope a, .scope .here { padding: .15rem .5rem; border: 1px solid var(--rule); border-radius: 3px; }
  .scope a { text-decoration: none; color: var(--ink-soft); }
  .scope a:hover { border-color: var(--edge); color: var(--ink); }
  .scope .here { background: var(--herb-wash); border-color: var(--herb); color: var(--ink); }

  /* the decisions, which are the point of reading any of this */
  .chunks { list-style: none; margin: 0; padding: 0; counter-reset: chunk; }
  .chunks li {
    counter-increment: chunk; padding: .85rem 0 .85rem 2.25rem;
    border-bottom: 1px solid var(--rule); position: relative;
  }
  .chunks li:first-child { border-top: 1px solid var(--rule); }
  .chunks li::before {
    content: counter(chunk); position: absolute; left: 0; top: .95rem;
    font: 11px ui-monospace, monospace; color: var(--ink-faint);
  }
  .chunks .head { margin: 0 0 .3rem; font-size: 14.5px; font-weight: 500; }
  .chunks .head a { text-decoration: none; }
  .chunks .head a:hover { text-decoration: underline; }
  .shift .surface { font: 12px ui-monospace, monospace; color: var(--ink-soft); }
  .chunks .at { margin: 0 0 .4rem; font: 11px ui-monospace, monospace; }
  .chunks .at a { color: var(--ink-faint); text-decoration: none; border-bottom: 1px dotted var(--edge); }
  .chunks .at a:hover { color: var(--ink); }
  .shift {
    display: grid; grid-template-columns: 5rem 1fr; gap: .1rem .6rem;
    margin: 0; font-size: 13px;
  }
  .shift dt {
    font: 10px ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-faint); padding-top: .35rem; white-space: nowrap;
  }
  .shift dd { margin: 0; }
  .shift .rejected { color: var(--ink-soft); }

  /* a note and what was said under it, where the code is */
  .thread {
    background: var(--raised); border-left: 2px solid var(--pick-edge);
    padding: .6rem .85rem;
  }
  .thread .turn { margin-bottom: .5rem; }
  .thread .answer { border-left: 1px solid var(--rule); padding-left: .7rem; margin-left: .2rem; }
  .thread .who {
    margin: 0; font: 10.5px ui-monospace, monospace; text-transform: uppercase;
    letter-spacing: .08em; color: var(--ink-faint);
  }
  .thread .who .when { margin-left: .5rem; }
  .thread .body { margin: .1rem 0 0; font-size: 13.5px; line-height: 1.5; }
  .thread .doing { display: flex; gap: .4rem; margin: .5rem 0 0; }

  .notes .answer {
    margin: .3rem 0 .4rem .6rem; padding-left: .6rem; font-size: 13px;
    border-left: 1px solid var(--rule); color: var(--ink-soft);
  }
  .notes .answer .who {
    font: 10px ui-monospace, monospace; text-transform: uppercase;
    letter-spacing: .08em; color: var(--herb); margin-right: .5rem;
  }

  /* the author explaining, which never blocks anything */
  .explains {
    background: var(--herb-wash); border-left: 2px solid var(--herb);
    padding: .5rem .85rem; font-size: 13px; line-height: 1.5;
  }
  .explains .who {
    font: 10.5px ui-monospace, monospace; text-transform: uppercase; letter-spacing: .08em;
    color: var(--herb); margin-right: .6rem;
  }

  /* the diff */
  .file { margin-bottom: 2rem; }
  .file > h2 {
    position: sticky; top: 0; z-index: 2; background: var(--raised);
    display: flex; justify-content: space-between; align-items: baseline;
    padding: .5rem .85rem; margin: 0 0 .6rem; border: 1px solid var(--rule); border-radius: 3px;
    font-size: 12px; letter-spacing: .04em; text-transform: none; color: var(--ink);
    font-family: ui-monospace, monospace;
  }
  .file > h2 { cursor: pointer; user-select: none; }
  .file > h2 .counts { font-size: 11px; display: flex; gap: .45rem; align-items: baseline; }
  .file > h2 .fold { display: inline-block; width: .8rem; color: var(--ink-faint); }
  .file.folded .fold { transform: rotate(-90deg); }
  .file.folded .hunk { display: none; }

  .chip {
    font-size: 10.5px; text-decoration: none; color: var(--ink-soft);
    border: 1px solid var(--rule); border-radius: 999px; padding: 0 .35rem;
  }
  .chip:hover { border-color: var(--herb); color: var(--ink); }

  /* the decision, said again where the code is */
  .decided { padding: .15rem 0 .15rem 5.1rem; font-size: 12px; }
  .decided a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px dotted var(--edge); }
  .decided a:hover { color: var(--ink); }

  .hunk { border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; margin-bottom: .85rem; background: var(--paper); }
  .hunk-header {
    background: var(--raised); color: var(--ink-faint);
    font: 11.5px ui-monospace, monospace; padding: .3rem .85rem; border-bottom: 1px solid var(--rule);
  }
  .line {
    display: grid; grid-template-columns: 3rem 3rem 1fr;
    font: 12.5px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
    position: relative;
  }
  .line:hover { background: var(--sunken); }
  .line { cursor: default; }
  .line .no {
    color: var(--ink-faint); text-align: right; padding: 0 .55rem;
    user-select: none; cursor: pointer; background: transparent;
  }
  .line .no:hover { background: var(--pick); color: var(--ink); }
  .line .text { cursor: text; }
  .line .text { white-space: pre-wrap; word-break: break-word; padding: 0 .85rem 0 .35rem; }
  .line.added { background: var(--add); box-shadow: inset 2px 0 0 var(--add-edge); }
  .line.removed { background: var(--del); box-shadow: inset 2px 0 0 var(--del-edge); }
  .line.picked { background: var(--pick); box-shadow: inset 2px 0 0 var(--pick-edge); }
  .line.noted .text::after {
    content: "note"; margin-left: .75rem; font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--herb); vertical-align: middle;
  }

  /* a line the page says back to you, outside every fragment so that a swap
     arriving in the same second cannot wipe it */
  .said {
    position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
    margin: 0; padding: .45rem .9rem; border-radius: 3px; z-index: 5;
    background: var(--herb-wash); border: 1px solid var(--herb);
    font: 12.5px ui-monospace, monospace; color: var(--ink);
  }
  .said[hidden] { display: none; }

  /* the composer sits under the lines it is about */
  .composer { background: var(--raised); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: .75rem .85rem; }
  .composer[hidden] { display: none; }
  .composer .where { margin: 0 0 .5rem; font-size: 11.5px; }
  .composer .row { display: flex; gap: .5rem; align-items: flex-start; }
  textarea {
    flex: 1; min-height: 4.5rem; background: var(--paper); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 3px; padding: .5rem .6rem;
    font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; resize: vertical;
  }
  textarea::placeholder { color: var(--ink-faint); }
  textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--herb); outline-offset: 1px;
  }
  .composer .hint { font: 11px ui-monospace, monospace; color: var(--ink-faint); margin: .4rem 0 0; }

  button {
    font: 500 13px ui-sans-serif, system-ui, sans-serif; height: 2.25rem; padding: 0 .9rem;
    border-radius: 3px; border: 1px solid var(--herb); background: var(--herb);
    color: var(--paper); cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--herb-deep); border-color: var(--herb-deep); }
  button:disabled { background: var(--sunken); border-color: var(--rule); color: var(--ink-faint); cursor: not-allowed; }
  button.quiet {
    background: transparent; color: var(--ink-soft); border-color: var(--edge);
    height: 1.9rem; font-size: 12px; padding: 0 .6rem;
  }
  button.quiet:hover:not(:disabled) { background: var(--sunken); color: var(--ink); border-color: var(--edge); }
  .wide { width: 100%; }

  /* the panel */
  aside { font-size: 14px; }
  .notes .meta a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px dotted var(--edge); }
  .notes .meta a:hover { color: var(--ink); }
  .checks { list-style: none; margin: 0 0 1.5rem; padding: 0; }
  .checks li {
    display: flex; gap: .6rem; align-items: baseline; padding: .4rem 0;
    border-bottom: 1px solid var(--rule); font: 12.5px ui-monospace, monospace;
  }
  .checks .name { flex: 1; }
  .checks .status { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
  .checks li.passed .status { color: var(--herb); }
  .checks li.failed .status { color: var(--warn); }
  .checks li.failed { background: var(--del); margin: 0 -.5rem; padding: .4rem .5rem; border-radius: 3px; }

  .notes { list-style: none; margin: 0; padding: 0; }
  .notes li { border-bottom: 1px solid var(--rule); padding: .7rem 0; }
  .notes li:first-child { border-top: 1px solid var(--rule); }
  .notes .meta { margin: 0 0 .25rem; font-size: 11.5px; }
  .notes .body { margin: 0 0 .5rem; font-size: 13.5px; line-height: 1.5; }
  .count { color: var(--herb); }
  .blocked { margin: .5rem 0 0; font-size: 11.5px; font-family: ui-monospace, monospace; }
  .land { width: 100%; margin-top: 1.25rem; }
  aside .quiet.wide { margin-top: .5rem; }

  /* the board */
  .proposals { list-style: none; padding: 0; margin: 0 0 .5rem; }
  .proposals li {
    display: flex; justify-content: space-between; gap: 1.5rem; align-items: baseline;
    padding: .6rem 0; border-bottom: 1px solid var(--rule);
  }
  .proposals li:first-child { border-top: 1px solid var(--rule); }
  .proposals a { text-decoration: none; }
  .proposals a:hover { text-decoration: underline; }
  .proposals .meta { margin: 0; white-space: nowrap; }
</style>
