<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      const saved = localStorage.getItem("githerb:theme");
      if (saved === "dark") document.documentElement.dataset.theme = "dark";
    </script>
    <title>{{ .Proposal.Title }} · githerb</title>
    {{ template "style.html" }}
  </head>
  <body data-proposal="{{ .ID }}">
    <header>
      <span class="wordmark">git<b>herb</b></span>
      <a href="/">all proposals</a>
      <span class="spacer"></span>
      <button class="theme" data-theme-toggle>dark</button>
    </header>

    <main>
      {{ template "page.html" . }}
    </main>
    <div class="composer" hidden>
      <p class="meta where"></p>
      <div class="row">
        <textarea placeholder="what should the agent do about these lines?"></textarea>
        <button>Leave it</button>
      </div>
      <p class="hint">cmd + enter to leave it · esc to drop the selection</p>
    </div>

    <script src="/static/review.js"></script>
    <script>
      document.addEventListener("click", (event) => {
        if (!event.target.closest("[data-theme-toggle]")) return;
        const root = document.documentElement;
        const dark = root.dataset.theme === "dark";
        dark ? delete root.dataset.theme : (root.dataset.theme = "dark");
        localStorage.setItem("githerb:theme", dark ? "light" : "dark");
        event.target.textContent = dark ? "dark" : "light";
      });
    </script>
  </body>
</html>
