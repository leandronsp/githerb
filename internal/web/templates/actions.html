<div id="actions">
  {{ if .Blocked }}<span class="blocked">{{ .Blocked }}</span>{{ end }}

  {{ if .Open }}
    <button class="quiet" data-handover>
      Copy {{ len .Open }} note{{ if gt (len .Open) 1 }}s{{ end }} for the agent
    </button>
  {{ end }}

  <button class="land" data-land {{ if not .Landable }}disabled{{ end }}>
    {{ if .Landable }}Land onto {{ .Proposal.Target }}{{ else }}Blocked{{ end }}
  </button>

  <button class="quiet" data-abandon>Abandon</button>
</div>
