# What a proposal has to pass before it can land. The command runs in a
# throwaway worktree of the head revision, not in your working tree.
[checks]
gate = "make check"

# What answers a handover. The brief arrives on stdin and the working directory
# is a throwaway worktree of the revision under review.
[agent]
command = "claude -p --permission-mode bypassPermissions"
