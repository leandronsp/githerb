[package]
name = "githerb"
description = "Code review and a gate for trunk, in one binary, with no server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "githerb"
path = "src/main.rs"

[dependencies]
app = { path = "crates/app" }
review = { path = "crates/review" }
web = { path = "crates/web" }
runner = { path = "crates/runner" }
clap = { workspace = true }
ctrlc = { workspace = true }

[lints]
workspace = true

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://github.com/leandronsp/githerb"

[workspace.dependencies]
review = { path = "crates/review" }
patch = { path = "crates/patch" }
gitstore = { path = "crates/gitstore" }
app = { path = "crates/app" }
web = { path = "crates/web" }
runner = { path = "crates/runner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
maud = "0.27"
sha2 = "0.11"
ctrlc = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
wildcard_enum_match_arm = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
