version: "2"

linters:
  default: none
  enable:
    # correctness
    - errcheck
    - govet
    - staticcheck
    - unused
    - forcetypeassert
    - makezero
    - nilerr
    - nilnil
    # the typing discipline, see .claude/rules/typing.md
    - exhaustive
    - exhaustruct_v5
    - ireturn
    # errors as values
    - errorlint
    - wrapcheck
    - err113
    # style and hygiene
    - revive
    - gocritic
    - gosec
    - godot
    - containedctx
    # tests
    - paralleltest
    - thelper

  settings:
    exhaustive:
      default-signifies-exhaustive: false
    exhaustruct_v5:
      # Only the domain. Elsewhere a partial literal is usually the point.
      enforce-patterns:
        - 'github.com/leandronsp/githerb/internal/review\..+'
    ireturn:
      allow:
        - error
        - stdlib
        - empty
        - generic
    revive:
      rules:
        - name: exported
        - name: package-comments

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - err113
          - exhaustruct_v5
          - wrapcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
